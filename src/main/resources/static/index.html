<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tarefas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    input, button {
      padding: 0.5rem;
      margin: 0.2rem;
    }
    .tarefa {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <h1>Lista de Tarefas</h1>

  <input type="text" id="descricao" placeholder="Digite uma nova tarefa">
  <button onclick="adicionarTarefa()">Adicionar</button>

  <hr>

  <div id="listaTarefas"></div>

  <script>
    const apiUrl = "http://localhost:8080/tarefas";

    async function carregarTarefas() {
      const resposta = await fetch(apiUrl);
      const tarefas = await resposta.json();

      const lista = document.getElementById("listaTarefas");
      lista.innerHTML = "";

      tarefas.forEach(tarefa => {
        const div = document.createElement("div");
        div.className = "tarefa";

        div.innerHTML = `
          <strong>${tarefa.descricao}</strong> - 
          ${tarefa.concluida ? "✅ Concluída" : "❌ Pendente"}<br>
          <button onclick="concluirTarefa(${tarefa.id})">Concluir</button>
          <button onclick="excluirTarefa(${tarefa.id})">Excluir</button>
        `;

        lista.appendChild(div);
      });
    }

    async function adicionarTarefa() {
      const descricao = document.getElementById("descricao").value;
      if (!descricao.trim()) return;

      await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descricao, concluida: false })
      });

      document.getElementById("descricao").value = "";
      carregarTarefas();
    }

    async function concluirTarefa(id) {
      const resposta = await fetch(`${apiUrl}/${id}`);
      const tarefa = await resposta.json();

      await fetch(`${apiUrl}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...tarefa, concluida: true })
      });

      carregarTarefas();
    }

    async function excluirTarefa(id) {
      await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
      carregarTarefas();
    }

    // Carrega as tarefas ao abrir a página
    carregarTarefas();
  </script>

</body>
</html>
